.sheet{position:absolute;bottom:0;left:0;right:0;z-index:44;max-height:calc(88% - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--sheet);border-radius:25px 25px 0 0;box-shadow:0 -9px 30px rgba(var(--ink-rgb),.06);outline:none;animation:sheet-in 220ms cubic-bezier(.2,.8,.2,1)}
.sheet.reader-full{max-height:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
.sheet-handle{height:19px;display:flex;align-items:center;justify-content:center;flex:none;touch-action:none;cursor:grab}.sheet-handle:after{content:"";width:34px;height:4px;border-radius:5px;background:var(--line)}.reader-full .sheet-handle{display:none}
.sheet-header{display:flex;align-items:center;gap:8px;padding:4px 16px 12px;flex:none;border-bottom:1px solid var(--line)}.sheet-title-group{flex:1;min-width:0}.sheet-title-group h2{font-size:17px;font-weight:600;margin:0;line-height:1.5}.sheet-title-group p{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.5}.sheet-header .icon-button{width:35px;height:35px;color:var(--secondary)}.sheet-header .icon-button .icon{width:19px;height:19px}
.sheet-content{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));min-height:0;outline:none}
.sheet.reader-full .sheet-content{flex:1}.sheet-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px max(16px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:none;background:var(--sheet)}
.detail-note{font-size:12px;line-height:1.75;color:var(--secondary);margin:0 0 17px}.section-heading{margin:19px 0 8px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.035em}.section-heading:first-child{margin-top:0}
.detail-row{display:flex;width:100%;align-items:center;gap:12px;min-height:66px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}.detail-row:last-child{border-bottom:0}.row-symbol{height:33px;width:33px;display:grid;place-items:center;border-radius:11px;background:var(--soft);color:var(--secondary);flex:none}.row-symbol .icon{width:18px;height:18px}.row-symbol.initial-symbol{font-size:13px}.row-copy{flex:1;min-width:0}.row-copy strong{display:block;font-size:14px;line-height:1.5;font-weight:500}.row-copy small{display:block;font-size:11px;line-height:1.7;color:var(--muted);margin-top:3px}.row-end{font-size:11px;color:var(--muted);flex:none}.row-end .icon{width:17px;height:17px}.detail-row.clickable:active{background:var(--hover)}
.setting-group{border-radius:17px;background:var(--surface);padding:0 14px;margin-bottom:13px;border:1px solid var(--line)}.setting-group .detail-row{min-height:62px}
.switch{width:35px;height:21px;border-radius:13px;background:var(--soft);flex:none;position:relative;transition:background var(--motion)}.switch:after{content:"";position:absolute;width:17px;height:17px;top:2px;left:2px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px #0001;transition:transform var(--motion)}
[aria-checked="true"] .switch{background:var(--accent)}[aria-checked="true"] .switch:after{transform:translateX(14px)}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool-card{min-height:89px;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:grid;grid-template-columns:22px 1fr;column-gap:9px;align-content:center}.tool-card .icon{width:19px;height:19px;grid-row:1/3;color:var(--accent);margin-top:1px}.tool-card b{font-size:13px;line-height:1.6;font-weight:500}.tool-card small{font-size:10px;line-height:1.6;color:var(--muted);margin-top:2px}.tool-card:active{background:var(--hover)}
.option-row[aria-checked="true"] .row-copy strong{color:var(--accent)}.option-row[aria-checked="true"] .row-end{color:var(--accent)}
.form-label{display:block;font-size:12px;color:var(--secondary);margin:4px 0 7px}.text-field{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:16px;line-height:1.5;padding:11px 12px;outline:none}.text-field:focus{border-color:var(--accent)}
.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.flat-button,.solid-button,.danger-button{min-height:41px;padding:10px 16px;border-radius:13px;font-size:13px;background:var(--soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:7px}.solid-button{background:var(--primary);color:var(--on-primary)}.danger-button{background:var(--danger);color:var(--on-primary)}
.reader-content{max-width:630px;margin-inline:auto;padding:1px 2px 12px}.reader-content .prose{line-height:2.03}.reader-content .prose p{margin-bottom:19px}.reader-byline{font-size:11px;color:var(--muted);margin-bottom:22px}
.type-controls{display:flex;gap:4px;align-items:center}.type-controls button{min-width:35px;height:36px;border-radius:10px;font:16px Georgia,serif}.type-controls button:active{background:var(--hover)}.type-controls span{font-size:11px;color:var(--muted);width:27px;text-align:center}.reader-back{font-size:12px;color:var(--accent);padding:10px 0 10px 12px;min-height:38px}
.segmented{display:flex;gap:5px;padding:4px;background:var(--soft);border-radius:12px}.segmented button{flex:1;padding:8px 12px;border-radius:9px;font-size:12px;min-height:35px}.segmented button.selected{background:var(--surface);box-shadow:0 1px 4px rgba(var(--ink-rgb),.06);color:var(--accent)}
.dice-result{font:500 60px/1.5 var(--serif);text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;margin:10px 0}.center-actions{display:flex;justify-content:center}.timeline-entry{border-left:1px solid var(--line);padding:0 0 20px 16px;margin-left:5px;position:relative}.timeline-entry:before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--accent-line)}.timeline-entry time{font-size:10px;color:var(--muted)}.timeline-entry p{margin:5px 0 0;font-size:13px;line-height:1.7;color:var(--secondary)}
.toast{position:absolute;left:50%;bottom:calc(var(--dock-clearance) + 4px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 34px);width:max-content;background:rgba(var(--ink-rgb),.94);color:var(--on-primary);box-shadow:0 3px 15px rgba(var(--ink-rgb),.06);border-radius:13px;padding:10px 14px;font-size:11px;line-height:1.6;text-align:center;pointer-events:none;animation:fade-in var(--motion) ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes menu-in{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}@keyframes drawer-in{from{transform:translateX(-100%)}to{transform:none}}@keyframes sheet-in{from{transform:translateY(35px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.transcript{padding-inline:32px}.header{padding-inline:25px}.capsules{padding-inline:29px}.composer-dock{left:28px;right:28px}.sheet{left:34px;right:34px;border-radius:25px 25px 0 0}.sheet.reader-full{left:0;right:0}.sheet-content{padding-inline:27px}}
@media(max-width:350px){.transcript{padding-inline:17px}.composer-dock{left:9px;right:9px}.composer{padding:10px 8px}.composer-tools{gap:5px}.circle-button{width:37px;height:37px}.model-pill{max-width:119px;padding-inline:9px;font-size:11px}.primary-button{width:41px;height:41px}.capsules{padding-inline:12px;gap:4px}.capsule{padding-inline:9px}.sheet-content{padding-inline:16px}.tool-grid{gap:7px}.tool-card{padding:11px}.popover{width:190px}}
@media(max-height:520px){.drawer-brand{margin-bottom:8px}.drawer-nav{grid-template-columns:1fr 1fr;gap:1px}.nav-item{font-size:12px;gap:7px;min-height:35px;padding:6px}.drawer-history{margin-top:8px;padding-top:8px}.drawer-footer{padding-top:6px}.local-label,.profile-button{display:none}.sheet{max-height:94%}.sheet-content{padding-top:12px}.composer textarea{max-height:76px}}
@media(prefers-reduced-motion:reduce){:root{--motion:0ms}*,*:before,*:after{animation-duration:0ms!important;transition-duration:0ms!important;scroll-behavior:auto!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top-glass:before{background:linear-gradient(var(--paper) 0%,rgba(var(--paper-rgb),.98) 68%,transparent 100%)}.composer{background:var(--surface)}}

/* Themes are global preferences, never a story state or a permanent chat toolbar. */
.app,.drawer,.sheet,.sheet-footer,.popover,.composer,.setting-group,
.model-pill,.circle-button,.row-symbol,.profile-avatar,.theme-preview,
.theme-choice,.theme-choice-check,.theme-mini-compose{
  transition-property:background-color,border-color,color,box-shadow;
  transition-duration:160ms;transition-timing-function:ease;
}
::selection{background:var(--accent-soft);color:var(--ink)}
.theme-preview{position:relative;margin:0 0 17px;border:1px solid var(--line);border-radius:18px;padding:17px 18px 15px;background:var(--paper)}
.theme-preview-meta{display:flex;align-items:center;gap:6px;font:11px/1.5 var(--ui);color:var(--muted);margin-bottom:11px}
.theme-preview-meta .icon{width:13px;height:13px}
.theme-preview-quote{font:500 19px/1.8 var(--reading-font);color:var(--ink);margin:0 0 3px}
.theme-preview-text{font:13px/1.8 var(--reading-font);color:var(--secondary);margin:0 0 12px}
.theme-mini-compose{display:flex;align-items:center;gap:10px;min-height:36px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:7px 10px;font:11px var(--ui);color:var(--muted)}
.theme-mini-compose .icon{width:13px;height:13px}.theme-mini-compose span{flex:1}
.theme-mini-send{display:grid;place-items:center;border-radius:50%;width:23px;height:23px;background:var(--primary);color:var(--on-primary);font-style:normal;flex:none}
.theme-choices{display:grid;gap:7px}
.theme-choice{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:transparent;text-align:left}
.theme-choice:hover{background:var(--soft)}
.theme-choice[aria-checked="true"]{background:var(--surface);border-color:var(--accent-line)}
.theme-swatches{position:relative;flex:none;width:45px;height:36px;display:block}
.theme-swatch{position:absolute;inset:0 auto auto 0;width:31px;height:34px;border:1px solid rgba(var(--ink-rgb),.13);border-radius:10px;background:var(--swatch-paper);box-shadow:0 1px 2px rgba(var(--ink-rgb),.03)}
.theme-swatch:nth-child(2){left:14px;top:5px;width:30px;height:30px;background:var(--swatch-surface)}
.theme-swatch:nth-child(2):after{content:"";position:absolute;width:7px;height:7px;right:5px;bottom:5px;border-radius:50%;background:var(--swatch-accent)}
.theme-choice-copy{flex:1;min-width:0}
.theme-choice-title{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px;font-weight:500;line-height:1.6}
.theme-default-tag{font:10px/1.4 var(--ui);padding:2px 6px;border-radius:5px;background:var(--soft);color:var(--secondary)}
.theme-choice-copy small{display:block;color:var(--muted);font:11px/1.6 var(--ui);margin-top:2px}
.theme-choice-check{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);flex:none;color:transparent}
.theme-choice-check .icon{width:12px;height:12px;stroke-width:2}
.theme-choice[aria-checked="true"] .theme-choice-check{background:var(--accent);border-color:var(--accent);color:var(--on-primary)}
.theme-footnote{font:11px/1.7 var(--ui);color:var(--muted);margin:14px 2px 0}
.theme-save-status{font-size:11px;color:var(--secondary);min-width:0;line-height:1.6}
.theme-done{min-width:70px}
@media(max-height:660px){.theme-preview{padding:10px 14px;margin-bottom:11px}.theme-preview-meta{margin-bottom:5px}.theme-preview-text{margin-bottom:7px}.theme-choice{min-height:60px}.theme-choices{gap:3px}}
@media(prefers-reduced-motion:reduce){.app,.drawer,.sheet,.sheet-footer,.popover,.composer,.setting-group,.model-pill,.circle-button,.row-symbol,.profile-avatar,.theme-preview,.theme-choice,.theme-choice-check,.theme-mini-compose{transition:none}}

<div class="app" id="app">
  <div class="workspace" id="workspace">
    <main class="scrollport" id="scrollport" aria-label="故事对话" tabindex="0"><div class="transcript" id="transcript"></div></main>
    <div class="top-chrome" id="topChrome">
      <div class="top-glass" aria-hidden="true"></div>
      <header class="header">
        <button class="icon-button" id="drawerButton" aria-label="打开侧边栏" aria-controls="drawer" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="heading"><h1 id="storyTitle">白鸦酒馆</h1><p id="storySubtitle">雾港 · 雨夜</p></div>
        <button class="icon-button" id="moreButton" aria-label="故事操作" aria-haspopup="menu" aria-controls="overflowMenu" aria-expanded="false"><svg class="icon"><use href="#i-more"/></svg></button>
      </header>
      <nav class="capsules" aria-label="当前场景">
        <button class="capsule" data-view="location" aria-haspopup="dialog"><svg class="icon"><use href="#i-location"/></svg><span id="locationLabel">主厅</span><svg class="icon small-chevron"><use href="#i-down"/></svg></button>
        <button class="capsule" data-view="people" aria-haspopup="dialog"><svg class="icon"><use href="#i-people"/></svg><span id="peopleLabel">在场 3</span><svg class="icon small-chevron"><use href="#i-down"/></svg></button>
        <button class="capsule" data-view="environment" aria-haspopup="dialog"><svg class="icon"><use href="#i-moon"/></svg><span id="environmentLabel">深夜 · 小雨</span></button>
      </nav>
    </div>
    <div class="bottom-haze" aria-hidden="true"></div>
    <button class="jump-button" id="jumpButton" aria-label="回到最新消息" title="回到最新消息"><svg class="icon"><use href="#i-down"/></svg></button>
    <div class="composer-dock" id="composerDock">
      <form class="composer" id="composerForm">
        <textarea id="prompt" aria-label="输入对话或行动" placeholder="你想做什么……" rows="1" maxlength="6000" spellcheck="false"></textarea>
        <div class="composer-tools">
          <button type="button" class="circle-button" data-view="tools" aria-label="行动与插件" title="行动与插件" aria-haspopup="dialog"><svg class="icon"><use href="#i-plus"/></svg></button>
          <button type="button" class="model-pill" data-view="models" aria-label="选择模型" aria-haspopup="dialog"><span id="modelLabel">默认模型</span><svg class="icon"><use href="#i-down"/></svg></button>
          <div class="tool-spacer"></div>
          <button type="button" class="circle-button mode-button" id="modeButton" data-view="mode" aria-label="叙事偏好：自动" title="叙事偏好：自动" aria-haspopup="dialog"><svg class="icon"><use href="#i-book"/></svg></button>
          <button type="submit" class="primary-button" id="primaryButton" aria-label="继续剧情" title="继续剧情（预置演示）"><svg class="icon continue-icon"><use href="#i-continue"/></svg><svg class="icon send-icon"><use href="#i-send"/></svg><svg class="icon stop-icon"><use href="#i-stop"/></svg></button>
        </div>
      </form>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1" hidden>
    <div class="drawer-brand"><strong id="drawerTitle">CoreRP</strong><button class="icon-button" data-dismiss aria-label="关闭侧边栏"><svg class="icon"><use href="#i-close"/></svg></button></div>

   const copy=el('span','theme-choice-copy'),title=el('span','theme-choice-title',t.name);if(id==='claude')title.append(el('span','theme-default-tag','默认'));copy.append(title,el('small','',t.description));
   const check=el('span','theme-choice-check');check.setAttribute('aria-hidden','true');check.append(icon('check'));n.append(swatches,copy,check);choices.append(n);
  }
  choices.addEventListener('keydown',e=>{
   if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;

   const next=e.key==='Home'?0:e.key==='End'?count-1:(i+(['ArrowUp','ArrowLeft'].includes(e.key)?-1:1)+count)%count;

  });

 }
 case 'settings':{
  setSheetTitle('阅读与故事设置',s.title);body.append(section('外观'));const appearance=el('div','setting-group');appearance.append(row('主题与外观',THEMES[state.settings.theme].name,'palette','>',()=>subSheet('appearance')));body.append(appearance,section('阅读'));const group=el('div','setting-group');const textRow=row('正文字号','', 'book');textRow.append(typeControls());group.append(textRow);const fontRow=el('div','detail-row');fontRow.append(el('span','row-copy','正文字体'));const segmented=el('div','segmented');for(const [key,label] of [['serif','宋体'],['sans','系统']]){const b=button(label,state.settings.font===key?'selected':'',()=>{state.settings.font=key;applyPreferences();persist();for(const btn of segmented.children)btn.classList.remove('selected');b.classList.add('selected');});segmented.append(b);}fontRow.append(segmented);group.append(fontRow);body.append(group,section('当前故事'));const settingsGroup=el('div','setting-group');settingsGroup.append(row('模型',s.model||'默认模型','settings','>',()=>subSheet('models')),row('叙事偏好',s.mode||'自动','book','>',()=>subSheet('mode')),row('扩展能力','管理行动菜单中的插件','plugin','>',()=>subSheet('plugins')));body.append(settingsGroup,section('本地原型'),note(storageOK?'设置、草稿和对话保存在当前浏览器中。此文件不发送网络请求，清除浏览器数据会移除存档。':'当前浏览器不允许本地存储，设置与对话仅保留在本次打开期间。请通过菜单导出需要保存的内容。'),note('输入框：Enter 换行，Ctrl / ⌘ + Enter 发送。空输入时的黑色按钮用于演示阶段切换与预置回复；运行时可按同一按钮停止。'),row('导出当前故事','保存为 Markdown 文本','export','>',()=>exportStory()));break;}
 case 'history':
  setSheetTitle('故事记录',s.title);for(const m of s.messages){const entry=el('div','timeline-entry');entry.append(el('time','',m.time||''),el('p','',`${m.kind==='user'?'你':m.name|| (m.kind==='event'?'场景变化':'旁白')} · ${messageText(m).slice(0,68)}${messageText(m).length>68?'…':''}`));body.append(entry);}if(!s.messages.length)body.append(note('这个故事还没有消息。'));break;
 case 'rename':{
  setSheetTitle('重命名故事');const f=el('form'),field=formInput('renameTitle','故事名称',s.title);const actions=el('div','form-actions');actions.append(button('取消','flat-button',()=>closeOverlay()));const submit=button('保存','solid-button');submit.type='submit';actions.append(submit);f.append(field.wrap,actions);f.addEventListener('submit',e=>{e.preventDefault();const value=field.input.value.trim();if(!value){field.input.focus();return;}s.title=value.slice(0,48);persist();$('storyTitle').textContent=s.title;document.title=`${s.title} · CoreRP`;renderRecents();closeOverlay();toast('故事名称已更新');});body.append(f);break;}

  setSheetTitle('新故事','本地空白存档');const f=el('form'),field=formInput('newTitle','故事名称','','给这段故事起一个名字');body.append(note('新故事以白鸦酒馆为演示场景，不会覆盖现有存档。'));const actions=el('div','form-actions');actions.append(button('取消','flat-button',()=>closeOverlay()));const submit=button('创建故事','solid-button');submit.type='submit';actions.append(submit);f.append(field.wrap,actions);f.addEventListener('submit',e=>{e.preventDefault();if(state.stories.length>=50){toast('演示最多保存 50 个故事，请先导出并整理。');return;}const value=field.input.value.trim();if(!value){field.input.focus();return;}const story={id:uid(),title:value.slice(0,48),scene:'tavern',model:s.model||'默认模型',mode:'自动',pinned:false,draft:'',demoIndex:0,messages:[]};state.stories.unshift(story);switchStory(story.id);});body.append(f);break;}

  setSheetTitle('删除这个故事？');body.append(note(`将删除「${s.title}」在此浏览器中的本地记录。此操作不可撤销，建议先导出。`));const actions=el('div','form-actions');actions.append(button('保留故事','flat-button',()=>closeOverlay()),button('确认删除','danger-button',()=>{removeThinkingIndicator();state.stories=state.stories.filter(x=>x.id!==s.id);if(!state.stories.length)state.stories=[{id:uid(),title:'新的故事',scene:'tavern',model:'默认模型',mode:'自动',pinned:false,draft:'',demoIndex:0,messages:[]}];state.active=state.stories[0].id;persist();closeOverlay();renderStory();toast('已删除本地故事');}));body.append(actions);break;}

function typeControls(){const group=el('div','type-controls'),label=el('span','font-size-value',String(state.settings.fontSize));const change=(n)=>{state.settings.fontSize=Math.min(21,Math.max(15,state.settings.fontSize+n));applyPreferences();persist();document.querySelectorAll('.font-size-value').forEach(x=>x.textContent=String(state.settings.fontSize));};const minus=button('A−','',()=>change(-1));minus.setAttribute('aria-label','缩小正文字号');const plus=button('A+','',()=>change(1));plus.setAttribute('aria-label','放大正文字号');group.append(minus,label,plus);return group;}
function updateComposerLabels(){$('modelLabel').textContent=current().model||'默认模型';$('modelLabel').parentElement.title=`模型：${current().model||'默认模型'}（演示配置）`;const mode=current().mode||'自动';$('modeButton').title=`叙事偏好：${mode}`;$('modeButton').setAttribute('aria-label',`叙事偏好：${mode}`);$('modeButton').classList.toggle('is-custom',mode!=='自动');}
$('readerExpand').addEventListener('click',()=>{const full=$('sheet').classList.toggle('reader-full');$('readerExpand').setAttribute('aria-label',full?'退出全屏阅读':'全屏阅读');$('readerExpand').title=full?'退出全屏阅读':'全屏阅读';$('readerExpand').replaceChildren(icon(full?'collapse':'expand'));});
function exportStory(){const s=current(),lines=[`# ${s.title}`,'',`> CoreRP 本地演示存档 · ${new Date().toLocaleString('zh-CN')}`,''];for(const msg of s.messages){const who=msg.kind==='user'?'你':msg.kind==='event'?'场景变化':msg.name||'旁白';lines.push(`## ${who}${msg.time?' · '+msg.time:''}${msg.demo?'（预置片段）':''}`,'',messageText(msg),'');}const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${s.title.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_')||'CoreRP'}.md`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已发起故事文件导出');}
// Drag only the handle, never the readable content. Buttons and Escape remain available.
let drag=null;$('sheetHandle').addEventListener('pointerdown',e=>{if($('sheet').classList.contains('reader-full'))return;drag={y:e.clientY,id:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId);});
$('sheetHandle').addEventListener('pointermove',e=>{if(drag)$('sheet').style.transform=`translateY(${Math.max(0,e.clientY-drag.y)}px)`;});
function finishDrag(e){if(!drag)return;const dist=e.clientY-drag.y;drag=null;$('sheet').style.transform='';if(dist>85)closeOverlay();}
$('sheetHandle').addEventListener('pointerup',finishDrag);$('sheetHandle').addEventListener('pointercancel',()=>{drag=null;$('sheet').style.transform='';});
// Follow the visual viewport when mobile browsers raise the keyboard.
let initialHeight=window.innerHeight;
function viewportChanged(){const vv=window.visualViewport;if(vv&&Math.abs(vv.scale-1)<.05){app.style.setProperty('--app-height',`${vv.height}px`);app.style.setProperty('--app-top',`${vv.offsetTop}px`);const editing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);app.classList.toggle('keyboard-open',editing&&vv.height<initialHeight*.8);}else if(!vv){app.style.setProperty('--app-height',`${window.innerHeight}px`);}requestAnimationFrame(()=>{measureDock();if(activeOverlay==='menu')positionMenu();});}
window.visualViewport?.addEventListener('resize',viewportChanged);window.visualViewport?.addEventListener('scroll',viewportChanged);window.addEventListener('resize',viewportChanged);window.addEventListener('orientationchange',()=>{setTimeout(()=>{initialHeight=window.innerHeight;viewportChanged();},250);});
prompt.addEventListener('focus',viewportChanged);prompt.addEventListener('blur',()=>setTimeout(viewportChanged,80));
if(window.ResizeObserver){new ResizeObserver(measureDock).observe($('composerDock'));}
